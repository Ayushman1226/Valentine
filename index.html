<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sunayna, Will You Be My Valentine? 💖</title>

  <style>
    :root{
      --pink:#ff4d6d;
      --bg1:#ff758c;
      --bg2:#ff7eb3;
    }

    body{
      margin:0;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:"Segoe UI", system-ui, Arial, sans-serif;
      background:linear-gradient(135deg,var(--bg1),var(--bg2));
      overflow:hidden;
    }

    .card{
      width:min(420px,92vw);
      background:#fff;
      border-radius:22px;
      padding:28px 26px 22px;
      text-align:center;
      box-shadow:0 20px 45px rgba(0,0,0,.25);
      position:relative;
    }

    .photos-row{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:14px;
      margin-top:4px;
    }

    .photos-row img{
      width:92px;
      height:92px;
      border-radius:50%;
      object-fit:cover;
      border:4px solid var(--pink);
      box-shadow:0 8px 18px rgba(0,0,0,.15);
    }

    .heart{
      font-size:30px;
    }

    h1{
      margin:18px 0 6px;
      color:var(--pink);
      font-size:24px;
    }

    .sub{
      margin:0 0 18px;
      color:#444;
      font-size:14px;
    }

    .buttons{
      position:relative;
      height:96px;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:14px;
    }

    button{
      border:none;
      padding:12px 22px;
      border-radius:999px;
      font-size:18px;
      cursor:pointer;
    }

    #yesBtn{
      background:var(--pink);
      color:#fff;
    }

    #yesBtn:hover{ transform:scale(1.08); }

    #noBtn{
      background:#e9e9e9;
      color:#333;
      position:absolute;
      left:60%;
      top:28px;
    }

    /* Overlay */
    .overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.55);
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      z-index:50;
    }

    .modal{
      width:min(760px,96vw);
      background:#fff;
      border-radius:22px;
      padding:18px;
      position:relative;
    }

    .modal h2{
      color:var(--pink);
      margin:6px 8px 10px;
    }

    .modal p{
      margin:0 8px 14px;
      color:#444;
    }

    .close{
      position:absolute;
      top:10px;
      right:10px;
      width:38px;
      height:38px;
      border-radius:50%;
      background:#000;
      color:#fff;
      border:none;
      cursor:pointer;
    }

    /* Auto-scrolling collage */
    .reel{
      height:360px;
      overflow:hidden;
      border-radius:18px;
      padding:8px;
    }

    .reel-track{
      display:flex;
      flex-direction:column;
      gap:12px;
      animation:scrollReel 25s linear infinite;
    }

    .reel-track img{
      width:100%;
      aspect-ratio:1/1;
      object-fit:cover;
      border-radius:16px;
      box-shadow:0 10px 22px rgba(0,0,0,.15);
    }

    .reel:hover .reel-track{
      animation-play-state:paused;
    }

    @keyframes scrollReel{
      from{transform:translateY(0);}
      to{transform:translateY(-50%);}
    }
  </style>
</head>

<body>

<div class="card">
  <div class="photos-row">
    <img src="me.jpg" alt="Me">
    <div class="heart">❤️</div>
    <img src="sunayna.jpg" alt="Sunayna">
  </div>

  <h1>Sunayna, will you be my Valentine? 💕</h1>
  <p class="sub">I have something special to show you…</p>

  <div class="buttons">
    <button id="yesBtn">Yes 💖</button>
    <button id="noBtn">No 💔</button>
  </div>
</div>

<audio id="bgMusic" src="romantic.mp3" preload="auto" loop></audio>

<div class="overlay" id="overlay">
  <div class="modal">
    <button class="close" id="closeBtn">✕</button>
    <h2>YAY! 💘</h2>
    <p>Sunayna, you just made my day 😍</p>

    <div class="reel">
      <div class="reel-track">
        <img src="1.jpg"><img src="2.jpg"><img src="3.jpg">
        <img src="4.jpg"><img src="5.jpg"><img src="6.jpg">
        <img src="1.jpg"><img src="2.jpg"><img src="3.jpg">
        <img src="4.jpg"><img src="5.jpg"><img src="6.jpg">
      </div>
    </div>
  </div>
</div>

<script>
  const noBtn=document.getElementById("noBtn");
  const yesBtn=document.getElementById("yesBtn");
  const overlay=document.getElementById("overlay");
  const closeBtn=document.getElementById("closeBtn");
  const music=document.getElementById("bgMusic");

  function moveNo(){
    const box=document.querySelector(".buttons").getBoundingClientRect();
    noBtn.style.left=Math.random()*(box.width-noBtn.offsetWidth)+"px";
    noBtn.style.top=Math.random()*(box.height-noBtn.offsetHeight)+"px";
  }

  noBtn.addEventListener("mouseenter",moveNo);
  noBtn.addEventListener("touchstart",moveNo,{passive:true});

  yesBtn.onclick=()=>{
    overlay.style.display="flex";
    music.volume=0.8;
    music.play().catch(()=>{});
  };

  closeBtn.onclick=()=>{
    overlay.style.display="none";
  };
</script>

</body>
</html>
