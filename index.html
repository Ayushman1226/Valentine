<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sunayna, Will You Be My Valentine? 💖</title>

  <style>
    :root{
      --pink:#ff4d6d;
      --bg1:#ff758c;
      --bg2:#ff7eb3;
    }

    body{
      margin:0;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:"Segoe UI", system-ui, Arial, sans-serif;
      background:linear-gradient(135deg,var(--bg1),var(--bg2));
      overflow:hidden;
    }

    .card{
      width:min(460px,94vw);
      background:#fff;
      border-radius:26px;
      padding:32px 28px 26px;
      text-align:center;
      box-shadow:0 24px 50px rgba(0,0,0,.25);
      position:relative;
    }

    .photos-row{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:18px;
      margin-bottom:8px;
    }

    .photos-row img{
      width:96px;
      height:96px;
      border-radius:50%;
      object-fit:cover;
      border:4px solid var(--pink);
      box-shadow:0 8px 18px rgba(0,0,0,.15);
    }

    .heart{
      font-size:32px;
    }

    h1{
      margin:16px 0 6px;
      color:var(--pink);
      font-size:26px;
    }

    .sub{
      margin:0 0 22px;
      color:#555;
      font-size:15px;
    }

    /* BUTTONS — CENTERED */
    .buttons{
      position:relative;
      height:90px;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:16px;
    }

    button{
      border:none;
      padding:14px 26px;
      border-radius:999px;
      font-size:18px;
      cursor:pointer;
      transition:transform .15s ease;
      user-select:none;
    }

    #yesBtn{
      background:var(--pink);
      color:#fff;
      box-shadow:0 12px 24px rgba(255,77,109,.35);
    }

    #yesBtn:hover{
      transform:scale(1.08);
    }

    /* NO button stays in layout */
    #noBtn{
      background:#ececec;
      color:#333;
      position:relative;
      transform:translate(0,0);
    }

    /* OVERLAY */
    .overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.55);
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      z-index:50;
    }

    .modal{
      width:min(760px,96vw);
      background:#fff;
      border-radius:26px;
      padding:20px;
      position:relative;
      box-shadow:0 30px 70px rgba(0,0,0,.35);
    }

    .modal h2{
      color:var(--pink);
      margin:8px 8px 10px;
      font-size:24px;
    }

    .modal p{
      margin:0 8px 16px;
      color:#444;
      font-size:15px;
    }

    .close{
      position:absolute;
      top:12px;
      right:12px;
      width:40px;
      height:40px;
      border-radius:50%;
      background:#000;
      color:#fff;
      border:none;
      cursor:pointer;
      opacity:.85;
    }

    .close:hover{ opacity:1; }

    /* AUTO-SCROLLING COLLAGE */
    .reel{
      height:380px;
      overflow:hidden;
      border-radius:20px;
      padding:8px;
      position:relative;
    }

    .reel-track{
      display:flex;
      flex-direction:column;
      gap:14px;
      animation:scrollReel 36s linear infinite;
      will-change:transform;
    }

    .reel-track img{
      width:100%;
      aspect-ratio:1/1;
      object-fit:cover;
      border-radius:18px;
      box-shadow:0 10px 22px rgba(0,0,0,.15);
    }

    /* Valentine message card (same size as images) */
    .end-message{
      width:100%;
      aspect-ratio:1/1;
      border-radius:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:18px;
      box-sizing:border-box;
      background:linear-gradient(135deg, rgba(255,117,140,.25), rgba(255,126,179,.25));
      border:2px dashed rgba(255,77,109,.6);
      box-shadow:0 10px 22px rgba(0,0,0,.10);
      color:#c81d50;
    }

    .end-message .big{
      font-size:22px;
      font-weight:800;
      margin-bottom:8px;
    }

    .end-message .small{
      font-size:15px;
      color:#7a2140;
      font-weight:600;
      line-height:1.35;
    }

    .reel:hover .reel-track{
      animation-play-state:paused;
    }

    @keyframes scrollReel{
      from{ transform:translateY(0); }
      to{ transform:translateY(-50%); }
    }

    @media (max-width:520px){
      .reel{ height:320px; }
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="photos-row">
      <img src="me.jpeg" alt="Me">
      <div class="heart">❤️</div>
      <img src="sunayna.jpeg" alt="Sunayna">
    </div>

    <h1>Sunayna, will you be my Valentine?</h1>
    <p class="sub">I have something special to show you if you say yes…</p>

    <div class="buttons">
      <button id="yesBtn">Yes 💖</button>
      <button id="noBtn">No 💔</button>
    </div>
  </div>

  <!-- MUSIC -->
  <audio id="bgMusic" src="romantic.mp3" preload="auto" loop></audio>

  <!-- COLLAGE OVERLAY -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <button class="close" id="closeBtn">✕</button>
      <h2>YAY! 💘</h2>
      <p>Sunayna, you just made my day 😍</p>

      <div class="reel">
        <div class="reel-track">
          <!-- Sequence A: 9 images + end message -->
          <img src="1.jpeg" alt="Memory 1">
          <img src="2.jpeg" alt="Memory 2">
          <img src="3.jpeg" alt="Memory 3">
          <img src="4.jpeg" alt="Memory 4">
          <img src="5.jpeg" alt="Memory 5">
          <img src="6.jpeg" alt="Memory 6">
          <img src="7.jpeg" alt="Memory 7">
          <img src="8.jpeg" alt="Memory 8">
          <img src="9.jpeg" alt="Memory 9">

          <div class="end-message" aria-label="Valentine message">
            <div>
              <div class="big">Sunayna 💖</div>
              <div class="small">
                Thank you for being you.<br>
                Will you be my Valentine forever? ✨
              </div>
            </div>
          </div>

          <!-- Sequence B (duplicate for seamless loop): same 9 images + end message -->
          <img src="1.jpeg" alt="Memory 1 duplicate">
          <img src="2.jpeg" alt="Memory 2 duplicate">
          <img src="3.jpeg" alt="Memory 3 duplicate">
          <img src="4.jpeg" alt="Memory 4 duplicate">
          <img src="5.jpeg" alt="Memory 5 duplicate">
          <img src="6.jpeg" alt="Memory 6 duplicate">
          <img src="7.jpeg" alt="Memory 7 duplicate">
          <img src="8.jpeg" alt="Memory 8 duplicate">
          <img src="9.jpeg" alt="Memory 9 duplicate">

          <div class="end-message" aria-label="Valentine message duplicate">
            <div>
              <div class="big">Sunayna 💖</div>
              <div class="small">
                Thank you for being you.<br>
                Will you be my Valentine forever? ✨
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const overlay = document.getElementById("overlay");
    const closeBtn = document.getElementById("closeBtn");
    const music = document.getElementById("bgMusic");

    function moveNoButton(){
      const box = document.querySelector(".buttons").getBoundingClientRect();
      const maxX = (box.width / 2) - noBtn.offsetWidth;
      const maxY = (box.height / 2) - noBtn.offsetHeight;

      const x = (Math.random() * 2 - 1) * maxX;
      const y = (Math.random() * 2 - 1) * maxY;

      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    }

    noBtn.addEventListener("mouseenter", moveNoButton);
    noBtn.addEventListener("touchstart", moveNoButton, { passive:true });

    yesBtn.onclick = () => {
      overlay.style.display = "flex";
      music.volume = 0.8;
      music.play().catch(()=>{});
    };

    closeBtn.onclick = () => {
      overlay.style.display = "none";
    };

    overlay.addEventListener("click", e => {
      if(e.target === overlay) overlay.style.display = "none";
    });
  </script>

</body>
</html>
