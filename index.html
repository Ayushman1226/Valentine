<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sunayna, Will You Be My Valentine? 💖</title>

  <style>
    :root{
      --pink:#ff4d6d;
      --bg1:#ff758c;
      --bg2:#ff7eb3;
    }

    body{
      margin:0;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:"Segoe UI", system-ui, Arial, sans-serif;
      background:linear-gradient(135deg,var(--bg1),var(--bg2));
      overflow:hidden;
    }

    .card{
      width:min(420px,92vw);
      background:#fff;
      border-radius:22px;
      padding:28px 26px 22px;
      text-align:center;
      box-shadow:0 20px 45px rgba(0,0,0,.25);
      position:relative;
    }

    .photos-row{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:14px;
      margin-top:4px;
    }

    .photos-row img{
      width:92px;
      height:92px;
      border-radius:50%;
      object-fit:cover;
      border:4px solid var(--pink);
      box-shadow:0 8px 18px rgba(0,0,0,.15);
    }

    .heart{
      font-size:30px;
      transform: translateY(-1px);
    }

    h1{
      margin:18px 0 6px;
      color:var(--pink);
      font-size:24px;
      line-height:1.2;
    }

    .sub{
      margin:0 0 18px;
      color:#444;
      font-size:14px;
      opacity:.92;
    }

    .buttons{
      position:relative;
      height:96px;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:14px;
      margin-top:6px;
    }

    button{
      border:none;
      padding:12px 22px;
      border-radius:999px;
      font-size:18px;
      cursor:pointer;
      transition:transform .15s ease;
      user-select:none;
    }

    #yesBtn{
      background:var(--pink);
      color:#fff;
      box-shadow:0 12px 22px rgba(255,77,109,.35);
    }

    #yesBtn:hover{
      transform:scale(1.08);
    }

    #noBtn{
      background:#e9e9e9;
      color:#333;
      position:absolute;
      left:60%;
      top:28px;
    }

    /* Overlay */
    .overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.55);
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      z-index:50;
    }

    .modal{
      width:min(760px,96vw);
      background:#fff;
      border-radius:22px;
      padding:18px;
      position:relative;
      box-shadow:0 25px 70px rgba(0,0,0,.35);
    }

    .modal h2{
      color:var(--pink);
      margin:6px 8px 10px;
      font-size:22px;
    }

    .modal p{
      margin:0 8px 14px;
      color:#444;
      font-size:14px;
    }

    .close{
      position:absolute;
      top:10px;
      right:10px;
      width:38px;
      height:38px;
      border-radius:50%;
      background:#000;
      color:#fff;
      border:none;
      cursor:pointer;
      opacity:.86;
    }

    .close:hover{
      opacity:1;
    }

    /* Auto-scrolling collage reel */
    .reel{
      height:360px;
      overflow:hidden;
      border-radius:18px;
      padding:8px;
    }

    .reel-track{
      display:flex;
      flex-direction:column;
      gap:12px;
      animation:scrollReel 30s linear infinite;
      will-change:transform;
    }

    .reel-track img{
      width:100%;
      aspect-ratio:1/1;
      object-fit:cover;
      border-radius:16px;
      box-shadow:0 10px 22px rgba(0,0,0,.15);
    }

    .reel:hover .reel-track{
      animation-play-state:paused;
    }

    @keyframes scrollReel{
      from{ transform:translateY(0); }
      to  { transform:translateY(-50%); }
    }

    @media (max-width:520px){
      #noBtn{ left:58%; }
      .reel{ height:320px; }
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="photos-row">
      <img src="me.jpeg" alt="Me">
      <div class="heart">❤️</div>
      <img src="sunayna.jpeg" alt="Sunayna">
    </div>

    <h1>Sunayna, will you be my Valentine? 💕</h1>
    <p class="sub">I have something special to show you if you say yes…</p>

    <div class="buttons">
      <button id="yesBtn">Yes 💖</button>
      <button id="noBtn">No 💔</button>
    </div>
  </div>

  <!-- Music (plays on Yes click) -->
  <audio id="bgMusic" src="romantic.mp3" preload="auto" loop></audio>

  <!-- Collage Overlay -->
  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="modal">
      <button class="close" id="closeBtn" aria-label="Close">✕</button>
      <h2>YAY! 💘</h2>
      <p>Sunayna, you just made my day 😍</p>

      <div class="reel">
        <div class="reel-track">
          <!-- 9 photos -->
          <img src="1.jpeg" alt="Memory 1">
          <img src="2.jpeg" alt="Memory 2">
          <img src="3.jpeg" alt="Memory 3">
          <img src="4.jpeg" alt="Memory 4">
          <img src="5.jpeg" alt="Memory 5">
          <img src="6.jpeg" alt="Memory 6">
          <img src="7.jpeg" alt="Memory 7">
          <img src="8.jpeg" alt="Memory 8">
          <img src="9.jpeg" alt="Memory 9">

          <!-- duplicates for seamless loop -->
          <img src="1.jpeg" alt="Memory 1 duplicate">
          <img src="2.jpeg" alt="Memory 2 duplicate">
          <img src="3.jpeg" alt="Memory 3 duplicate">
          <img src="4.jpeg" alt="Memory 4 duplicate">
          <img src="5.jpeg" alt="Memory 5 duplicate">
          <img src="6.jpeg" alt="Memory 6 duplicate">
          <img src="7.jpeg" alt="Memory 7 duplicate">
          <img src="8.jpeg" alt="Memory 8 duplicate">
          <img src="9.jpeg" alt="Memory 9 duplicate">
        </div>
      </div>

    </div>
  </div>

  <script>
    const noBtn   = document.getElementById("noBtn");
    const yesBtn  = document.getElementById("yesBtn");
    const overlay = document.getElementById("overlay");
    const closeBtn= document.getElementById("closeBtn");
    const music   = document.getElementById("bgMusic");

    function moveNoButton(){
      const box = document.querySelector(".buttons").getBoundingClientRect();
      const maxX = Math.max(0, box.width  - noBtn.offsetWidth);
      const maxY = Math.max(0, box.height - noBtn.offsetHeight);

      noBtn.style.left = (Math.random() * maxX) + "px";
      noBtn.style.top  = (Math.random() * maxY) + "px";
    }

    noBtn.addEventListener("mouseenter", moveNoButton);
    noBtn.addEventListener("touchstart", moveNoButton, { passive: true });

    function openOverlay(){
      overlay.style.display = "flex";
      overlay.setAttribute("aria-hidden", "false");

      // play music after user gesture (browser-friendly)
      music.volume = 0.8;
      music.play().catch(()=>{});
    }

    function closeOverlay(){
      overlay.style.display = "none";
      overlay.setAttribute("aria-hidden", "true");
      // Optional: stop music when closing
      // music.pause(); music.currentTime = 0;
    }

    yesBtn.addEventListener("click", openOverlay);
    closeBtn.addEventListener("click", closeOverlay);
    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) closeOverlay();
    });
  </script>

</body>
</html>
